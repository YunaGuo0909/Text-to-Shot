model:
  person_dim: 4
  hidden_dim: 128
  num_layers: 4
  num_heads: 4
  dropout: 0.1

diffusion:
  num_timesteps: 1000
  beta_schedule: cosine

text_encoder:
  model_name: "openai/clip-vit-base-patch32"
  max_length: 77
  freeze: true

trajectory:
  default_num_frames: 48
  motion_types: ["static", "dolly-in", "dolly-out", "pan-left", "pan-right", "crane-up", "crane-down", "track", "orbit"]
  motion_type_dim: 64

training:
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_epochs: 250
  lr_scheduler: cosine
  warmup_epochs: 10
  gradient_clip: 1.0
  save_interval: 25
  eval_interval: 10
  cfg_dropout_prob: 0.25

data:
  data_root: "/transfer/stc-data"
  train_index_file: "train_index.json"
  test_index_file: "test_index.json"
  norm_stats_path: "/transfer/stc-data/norm_stats.json"
  num_workers: 4
  pin_memory: true

paths:
  checkpoint_dir: "/transfer/two-stage-checkpoints/stage1"
  output_dir: "/transfer/two-stage-outputs/stage1"
  log_dir: "/transfer/two-stage-logs/stage1"
