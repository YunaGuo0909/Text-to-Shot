# ============================================================
# Script-to-Camera (STC): Joint Person-Camera Trajectory Generation
# Single-person scene — dual-branch diffusion with cross-attention
# ============================================================

# --- Model Architecture ---
model:
  # Camera state: (tx, ty, tz, azimuth, elevation, roll)
  camera_dim: 6
  # Person root trajectory: (px, py, pz)
  person_dim: 3
  # Hidden dimension for dual-branch Transformer
  hidden_dim: 256
  # Number of dual-branch Transformer layers
  num_layers: 6
  # Number of attention heads
  num_heads: 4
  # Dropout rate
  dropout: 0.2

# --- Diffusion Settings ---
diffusion:
  num_timesteps: 1000
  beta_schedule: cosine
  beta_start: 0.0001
  beta_end: 0.02

# --- Text Encoder ---
text_encoder:
  model_name: "openai/clip-vit-base-patch32"
  max_length: 77
  freeze: true

# --- Shot Type Settings ---
shot_types:
  categories:
    - "close-up"
    - "medium-shot"
    - "wide-shot"
    - "over-the-shoulder"
    - "two-shot"
  embedding_dim: 64

# --- Trajectory ---
trajectory:
  # Default trajectory length in frames (at 24fps → 2 seconds)
  default_num_frames: 48
  # Camera motion types (used for conditioning)
  motion_types:
    - "static"
    - "dolly-in"
    - "dolly-out"
    - "pan-left"
    - "pan-right"
    - "crane-up"
    - "crane-down"
    - "track"
    - "orbit"
  motion_type_dim: 64

# --- Training ---
training:
  batch_size: 64
  learning_rate: 0.0001
  weight_decay: 0.0001
  num_epochs: 250
  lr_scheduler: cosine
  warmup_epochs: 10
  gradient_clip: 1.0
  save_interval: 25
  eval_interval: 10
  cfg_dropout_prob: 0.25   # Classifier-Free Guidance: higher = stronger CFG at inference

# --- Data ---
data:
  # E.T. dataset root (downloaded by scripts/download_et_data.py)
  et_data_root: "/transfer/et-data"
  # Preprocessed data root (output of scripts/preprocess_et_data.py)
  data_root: "/transfer/stc-data"
  train_index_file: "train_index.json"
  test_index_file: "test_index.json"
  norm_stats_path: "/transfer/stc-data/norm_stats.json"   # run compute_norm_stats.py first
  num_workers: 4
  pin_memory: true

# --- Paths ---
# All outputs under /transfer with stc- prefix
paths:
  checkpoint_dir: "/transfer/stc-checkpoints"
  output_dir: "/transfer/stc-outputs"
  log_dir: "/transfer/stc-logs"
